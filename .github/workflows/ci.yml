name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed database (create admin account)
        env:
          DATABASE_URL: "sqlite:///${{ github.workspace }}/ci_test.db"
          SECRET_KEY: "ci-secret-key"
        run: python seed.py

      - name: Run smoke tests
        env:
          DATABASE_URL: "sqlite:///${{ github.workspace }}/ci_test.db"
          SECRET_KEY: "ci-secret-key"
        run: |
          python smoke.py
          python smoke_projects.py
          python smoke_procurements.py
          python smoke_payments.py
          python smoke_projects_v2.py
