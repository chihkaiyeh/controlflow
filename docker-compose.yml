services:
  controlflow:
    build: .
    container_name: controlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      # SECRET_KEY 必填，可直接寫在 .env（不要 commit）；預設值在生產模式會拒絕啟動
      - SECRET_KEY=${SECRET_KEY:?請在 .env 或環境中設定 SECRET_KEY}
      # DB 與附件都放在掛載的 volume 裡，容器重啟/重建資料不丟
      - DATABASE_URL=sqlite:////data/app.db
      - UPLOAD_FOLDER=/data/uploads
    volumes:
      # 把 /data 掛到具名 volume（也可用 :/path/on/nas 指向 NAS 掛載目錄）
      - controlflow_data:/data

volumes:
  controlflow_data:
