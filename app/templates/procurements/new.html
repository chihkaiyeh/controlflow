{% extends "base.html" %}
{% block title %}新增採購申請{% endblock %}
{% block content %}
<h3 class="mb-4">新增採購申請</h3>
<form method="post" class="bg-white p-4 rounded shadow-sm" style="max-width:640px">
  <div class="mb-3">
    <label class="form-label">所屬專案</label>
    <select name="project_id" class="form-select">
      <option value="">（不指定）</option>
      {% for p in projects %}
      <option value="{{ p.id }}">{{ p.code }} - {{ p.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="row">
    <div class="col-md-8 mb-3">
      <label class="form-label">品項名稱 <span class="text-danger">*</span></label>
      <input type="text" name="item_name" class="form-control" required autofocus>
    </div>
    <div class="col-md-4 mb-3">
      <label class="form-label">規格</label>
      <input type="text" name="spec" class="form-control">
    </div>
  </div>
  <div class="row">
    <div class="col-md-4 mb-3">
      <label class="form-label">數量</label>
      <input type="number" step="0.01" name="qty" class="form-control" value="1">
    </div>
    <div class="col-md-4 mb-3">
      <label class="form-label">單位</label>
      <input type="text" name="unit" class="form-control" placeholder="個/台/批">
    </div>
    <div class="col-md-4 mb-3">
      <label class="form-label">預估金額 (TWD)</label>
      <input type="number" step="0.01" name="estimated_price" class="form-control" value="0">
    </div>
  </div>
  <div class="mb-3">
    <label class="form-label">申請理由</label>
    <textarea name="reason" class="form-control" rows="2"></textarea>
  </div>
  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary">送出申請</button>
    <a href="{{ url_for('procurements.index') }}" class="btn btn-outline-secondary">取消</a>
  </div>
</form>
{% endblock %}
